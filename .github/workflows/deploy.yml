name: Build & Deploy to EC2

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build JAR (skip tests)
        run: ./gradlew :capstone-api:bootJar -x test

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.EC2_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Upload JAR to server
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} 'mkdir -p ~/app'
          JAR_FILE=$(ls capstone-api/build/libs/capstone-api-*.jar | grep -v plain | head -1)
          scp -i ~/.ssh/id_rsa \
            "$JAR_FILE" \
            ubuntu@${{ secrets.EC2_HOST }}:~/app/app.jar

      - name: Restart application
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} bash << 'EOF'
            pkill -f 'app.jar' || true
            sleep 3
            nohup java -jar ~/app/app.jar \
              --spring.config.additional-location=file:$HOME/app/ \
              > ~/app/app.log 2>&1 &
            disown
            echo "Deploy complete — PID $!"
          EOF
